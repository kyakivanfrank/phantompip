name: Automated Database Cleanup (8-Hour)

on:
  schedule:
    # Runs automatically every 8 hours (at 00:00, 08:00, 16:00 UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Target Vercel URL (e.g. https://phantompip.vercel.app). Leave empty to use GitHub Secret/Variable SITE_URL'
        required: false
        default: ''

jobs:
  cleanup:
    name: Run Database Cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cleanup Endpoint
        env:
          INPUT_URL: ${{ github.event.inputs.site_url }}
          SECRET_URL: ${{ secrets.SITE_URL }}
          VAR_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET="${INPUT_URL:-${SECRET_URL:-$VAR_URL}}"

          if [ -z "$TARGET" ]; then
            echo "::error::No site URL provided! Please set 'SITE_URL' in GitHub repository Secrets or Variables (e.g. https://your-project.vercel.app)."
            exit 1
          fi

          # Strip trailing slash if present
          TARGET="${TARGET%/}"
          ENDPOINT="$TARGET/api/admin/cron-cleanup"
          echo "Triggering cleanup endpoint: $ENDPOINT"

          AUTH_HEADER=""
          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          fi

          HTTP_RESPONSE=$(curl -s -S -w "\nHTTP_STATUS:%{http_code}" -X POST "$ENDPOINT" \
            ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
            -H "User-Agent: github-actions-cron" \
            -H "Content-Type: application/json")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1 | sed -e 's/^HTTP_STATUS://')

          echo "Response Body: $HTTP_BODY"
          echo "HTTP Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Database cleanup completed successfully!"
          else
            echo "::error::Database cleanup failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
